name: import-plugin-release

# The release robot for the ai-tc pin (AGENTS.md, "ai-tc is pinned"). Every 15
# minutes, and on a manual dispatch, it looks for an npm release of
# @akasecurity/ai-tc-claude-code above every version main or a fleet-v tag has
# pinned, verifies it against the live registry with .github/scripts/release_checks.py
# (exact x.y.z, registry dist, SLSA provenance bound to ai-tc's release workflow at
# the version's own tag, and the attested commit on ai-tc's main), and opens a PR
# moving the pin. It never takes npm `latest` on trust. A candidate the checks
# cannot reach a verdict on (a registry, network, npm or GitHub API failure) stops
# the run red: it never falls back to a lower version while a higher one has no
# verdict, and the next run tries again. A dispatch naming a lower target that is
# still above every pin imports that release meanwhile, because it reads no
# candidate list; the scheduled run stays red until a higher release passes.
#
# Two jobs. `verify` holds no secret and decides. `open-pr` runs in the
# marketplace-bot environment, whose deployment policy admits only main, and acts
# as the bot App: a bot branch made with a create-only ref, never force-pushed (an
# existing branch with an open PR is skipped; one the bot's closed PR used is skipped
# on a plain forward run, and deleted and created again only by a reimport or
# rollback dispatch; one no PR ever used was left by a run that died before opening
# it, and any run deletes it and creates it again), the PR, and auto-merge
# (squash). Acting as the App, not with the workflow's own token, is what lets
# validate start on the PR and lets the merge start tag-release: events the
# workflow token causes start no pull_request_target or push runs.
#
# Direction. The schedule only moves the pin up, and only above every version
# ever pinned: a version a rollback moved away from, or whose PR a code owner
# closed unmerged, comes back only through a dispatch with reimport: true.
# Moving the pin down is mode rollback, to a version a fleet-v tag has pinned
# and not below the rollback floor in rollback-safety.json (below_floor opens the
# PR anyway; validate then fails it, so only an org owner's break-glass merge
# lands it). While a rollback PR is open the schedule opens nothing, and a pull
# request that a forward dispatch opens gets no auto-merge.
#
# One code owner's approval, after running the candidate in one real session
# (the PR's checklist), is the only human act per release; tag-release then
# cuts the next fleet-v<N> tag at the squash commit.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "forward: the highest passing release, or target. rollback: to target. remove and restore are not available."
        type: choice
        options: [forward, rollback, remove, restore]
        default: forward
      target:
        description: "An exact x.y.z (forward or rollback), or fleet-v<N> (rollback). Empty: the highest passing release."
        type: string
        required: false
        default: ""
      reimport:
        description: "forward only: re-import a version a rollback moved away from, or whose bot PR a code owner closed"
        type: boolean
        default: false
      below_floor:
        description: "rollback only: open the PR below the rollback floor (validate fails it; only break-glass lands it)"
        type: boolean
        default: false

# Scheduled and forward runs share one group, so two imports never race for one
# branch; rollback (and remove and restore, once built) each queue in their own
# group, so a scheduled run can never replace a pending rollback. A group keeps
# one pending run and drops the rest; a dropped scheduled run is harmless, since
# the next tick re-evaluates. The groups do not wait for each other, so a forward run
# looks for an open rollback PR before it enables auto-merge and again after, and
# turns auto-merge off if one opened meanwhile.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'import-forward' || format('import-{0}', inputs.mode) }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.plan.outputs.proceed }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # main, spelled out: on schedule github.event carries no repository, and the
      # manifest the plan reads is main's whatever branch a dispatch ran from.
      # 11d5960a326750d5838078e36cf38b85af677262 == v4.4.0 (verified with git ls-remote).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # npm 11.12 or later: on an older npm, `npm audit signatures --include-attestations`
      # prints no attestations at all, so release_checks stops with no verdict (a
      # toolchain failure) rather than judge a release it cannot see. Node 24.15.0 is the
      # first release that bundles it (npm 11.12.1; every later 24.x bundles a newer npm).
      # A bare "24" is not enough: setup-node takes a copy of Node in the runner's tool cache
      # that matches the spec before it downloads anything, so "24" can resolve to an older
      # cached 24.x. No older copy matches a range that starts at 24.15.0, so the action uses
      # a cached copy of 24.15.0 or later if there is one, and downloads a release otherwise.
      # The check refuses an older npm with no verdict (MIN_NPM in release_checks.py), but the
      # workflow should not depend on that.
      # 49933ea5288caeca8642d1e84afbd3f7d6820020 == v4.4.0.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ">=24.15.0 <25"
      - name: plan (no secrets)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'forward' }}
          TARGET: ${{ inputs.target }}
          REIMPORT: ${{ inputs.reimport && 'true' || 'false' }}
          BELOW_FLOOR: ${{ inputs.below_floor && 'true' || 'false' }}
        run: python3 .github/scripts/import_release.py plan --repo-dir .

  open-pr:
    name: open-pr
    needs: verify
    if: needs.verify.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      # bcd2ba49218906704ab6c1aa796996da409d3eb1 == v3.2.0 (verified with git ls-remote).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.MARKETPLACE_BOT_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: create the bot branch, open the PR, enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN_JSON: ${{ needs.verify.outputs.plan }}
        run: python3 .github/scripts/import_release.py open-pr
