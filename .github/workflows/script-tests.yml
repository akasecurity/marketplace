name: script-tests

# Runs the release-check unit tests on the PR's own code. This is safe on pull_request:
# the token is read-only and no secret is in scope. It is not a required check; a red run
# here means the module every release workflow runs has regressed.
#
# It runs on every pull request, with no path filter. The suite takes about a minute, and a
# filter has to name every file a test reads: one did not, and a change to a workflow file
# alone ran no tests, though a test reads the workflow.
#
# That includes a change to .github/CODEOWNERS alone, which matters because tag-release reads
# the file strictly: once a commit is merged, the CODEOWNERS at its parent can no longer change,
# so a pin change a pull request merged on top of an unreadable file is tagged
# `approver: unknown`. The test that reads this repository's own copy runs here, on the PR.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: script-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 11d5960a326750d5838078e36cf38b85af677262 == v4.4.0 (the pin import-plugin-release.yml uses).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: unit tests (standard library only, no outside network)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
