name: main-audit

# On every push to main: red unless every commit the push added to main's
# first-parent line is the merge commit of a PR whose final head has an
# approving review from a code owner other than its last pusher, and a passing
# validate check from GitHub Actions (AGENTS.md, "The workflows"). The branch
# commits a merge-commit merge brings in are not on that line and are not checked.
# Detective only: the main ruleset prevents, and this records a bypass. It runs
# from the pushed commit's own copy, so a bypass push could change it in the
# same push. Each offending commit, each push that rewrote main and each push
# the audit could not finish gets its own issue, which only a person closes; if
# the job itself dies (a timeout), that push gets a workflow issue of its own too.
# No concurrency group: a group drops pending runs, and a dropped run would be
# an unaudited push.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      results: ${{ steps.audit.outputs.results }}
    steps:
      # The pushed commit, with full history so the push's first commit has its parent.
      # 11d5960a326750d5838078e36cf38b85af677262 == v4.4.0 (verified with git ls-remote).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: audit the commits this push added
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 .github/scripts/main_audit.py --repo-dir .

  file-issues:
    name: file-issues
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: open an issue for each commit that reached main unapproved or unvalidated
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_JSON: ${{ needs.audit.outputs.results }}
          JOB_RESULT: ${{ needs.audit.result }}
          AFTER: ${{ github.event.after }}
        run: python3 .github/scripts/issue_router.py apply --label main-audit
